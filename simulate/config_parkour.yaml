robot: "g1"
# Default interactive parkour simulator shows the same deterministic complex
# terrain family used by scripts/play_parkour.py: up/down stairs, safe gap
# surrogates, centered boxes, and mesh-box stepping stones.
# Headless/manual validation can pass scene_g1_parkour_flat.xml explicitly
# through the simulator --scene/robot_scene configuration path.
robot_scene: "src/assets/robots/unitree_g1/xmls/scene_g1_parkour.xml"

domain_id: 0
interface: "lo"

use_joystick: 1
joystick_type: "xbox"
joystick_device: "/dev/input/js0"
joystick_bits: 16

print_scene_information: 1
wait_for_lowcmd_before_physics: 1
realtime_lockstep: 1
lowcmd_kp_scale: 0.9
lowcmd_kd_scale: 1.1
enable_elastic_band: 0
initial_base_pos: [0.0, 0.0, 0.9]
initial_base_quat: [1.0, 0.0, 0.0, 0.0]
initial_joint_pos: [
  -0.312, 0.0, 0.0, 0.669, -0.363, 0.0,
  -0.312, 0.0, 0.0, 0.669, -0.363, 0.0,
  0.0, 0.0, 0.0,
  0.2, 0.2, 0.0, 0.6, 0.0, 0.0, 0.0,
  0.2, -0.2, 0.0, 0.6, 0.0, 0.0, 0.0,
]

enable_depth_camera: 1
depth_camera_name: "parkour_depth_camera"
depth_pointcloud_topic: "rt/parkour_depth/points"
depth_camera_width: 64
depth_camera_height: 36
depth_window_scale: 10
depth_max_distance: 2.5
# Preserve very near pixels as near/dark policy-depth observations.  Mapping
# sub-10cm self/foreground pixels to far/white destabilizes full live depth.
depth_camera_min_distance: 0.0
depth_camera_ray_alignment: "base"
# Default depth debug window shows the same 18x32 policy crop configured in
# deploy.yaml crop_region=[18, 0, 16, 16], not the full raw 64x36 renderer
# frame.  This avoids misleading raw-frame self/edge artifacts in the live
# policy-depth window.
depth_debug_crop_top: 18
depth_debug_crop_left: 16
depth_debug_crop_width: 32
depth_debug_crop_height: 18
depth_debug_policy_display: 1
depth_debug_artifact_floor: 0.10
depth_debug_artifact_ceiling: 0.75
# The C++ OpenGL path exposes two near-plane/self-occlusion rows at the
# bottom of the policy crop that scripts/play_parkour.py does not produce.
# Extrapolate them from the nearest valid crop rows before DDS publish and
# debug display so live policy input matches the Python MuJoCo depth path.
depth_policy_bottom_artifact_rows: 2
depth_publish_period_ms: 100
