support_geometry_interface:
  version: sgi_v1
  anchor_names:
  - trunk
  - left_hand
  - right_hand
  - left_foot
  - right_foot
  patch_shape:
  - 32
  - 32
  history_length: 0
  normalization_frame: torso_link
  missing_data_policy: zeros
  depth_camera:
    sensor_name: support_depth
    parent_body: robot/torso_link
    width: 32
    height: 32
    data_types:
    - depth
    cutoff_distance: 1.5
    topic_name: ''
    pointcloud_mode: euclidean_norm
    timeout_ms: 500
    retain_last_valid_frame: true
    organized_pointcloud: true
    pointcloud_field_names:
      x: x
      y: y
      z: z
